name = "Galaxy Collision"
author = "Kinetic"
description = "Spiral galaxies, up to 131,072 stars, colliding under gravity: tidal tails, bridges and a slow merger. A new encounter begins every few minutes"
fps = 60
scale = 1.0
pointer = false
adaptive = true
preview_time = 41
preview_warmup = 40
common = "common.glsl"

[param.galaxies]
type = "int"
label = "Galaxies"
min = 1
max = 5
default = 2
restart = true

[param.galsize]
label = "Galaxy size"
min = 0.3
max = 2.5
step = 0.05
default = 1
restart = true

[param.variety]
label = "Size differences"
description = "0: every galaxy alike, 1: the others between a third and nearly the first one's mass"
min = 0
max = 1
step = 0.05
default = 1
restart = true

[param.separation]
label = "Starting distance"
min = 0.3
max = 2.5
step = 0.05
default = 1
restart = true

[param.angle]
label = "Collision angle"
description = "0: head-on, higher: the galaxies swing past each other (degrees)"
min = 0
max = 75
step = 1
default = 30
restart = true

[param.approach]
label = "Collision speed"
description = "Below 1 they fall together, above about 1.15 they fly apart"
min = 0.3
max = 1.4
step = 0.05
default = 1
restart = true

[param.vary]
label = "Variation"
description = "How much each new encounter changes the angle and speed"
min = 0
max = 1
step = 0.05
default = 0.5
restart = true

[param.shape]
type = "choice"
label = "Galaxy shape"
options = ["spiral", "irregular", "ring", "lenticular", "elliptical", "mixed"]
default = "spiral"
restart = true

[param.spin]
type = "choice"
label = "Spin"
description = "Which way the galaxies turn against their orbits: with them they throw long tails, against them they stay whole"
options = ["random", "with the orbit", "against the orbit", "one each way"]
default = "random"
restart = true

[param.arms]
label = "Spiral arms"
min = 0
max = 1.5
step = 0.05
default = 0.7
restart = true

[param.armcount]
type = "int"
label = "Arms"
min = 1
max = 6
default = 2
restart = true

[param.winding]
label = "Arm winding"
min = 0
max = 3
step = 0.05
default = 1
restart = true

[param.speed]
label = "Speed"
min = 0.1
max = 4
step = 0.1
default = 1

[param.cycle]
type = "int"
label = "New encounter every (minutes)"
min = 1
max = 30
default = 2

[param.seed]
type = "int"
label = "Encounter"
description = "Which galaxies and which orbits"
min = 0
max = 999
default = 0
restart = true

[param.stars]
type = "int"
label = "Stars"
min = 8192
max = 131072
step = 8192
default = 65536

[param.zoom]
label = "Zoom"
min = 0.3
max = 4
step = 0.05
default = 1.2

[param.turn]
label = "Camera turn"
min = 0
max = 360
step = 5
default = 0

[param.tilt]
label = "Viewing angle"
min = 0
max = 1.3
step = 0.05
default = 0.5

[param.panx]
label = "Camera left / right"
min = -0.8
max = 0.8
step = 0.02
default = 0

[param.pany]
label = "Camera up / down"
min = -0.5
max = 0.5
step = 0.02
default = 0

[param.bgstars]
label = "Background stars"
min = 0
max = 4
step = 0.1
default = 1

[param.glow]
label = "Glow"
min = 0
max = 2
step = 0.05
default = 1

[param.brightness]
label = "Brightness"
min = 0.2
max = 3
step = 0.05
default = 1

[param.trails]
label = "Trails"
min = 0
max = 0.9
step = 0.01
default = 0.3

[preset.Pair]
galaxies = 2
galsize = 1
separation = 1
angle = 30
zoom = 1.2

[preset."Close up"]
galaxies = 2
zoom = 2.2
tilt = 0.3

[preset.Crowd]
galaxies = 4
galsize = 0.7
separation = 1.4
zoom = 0.9

[preset."Head-on"]
galaxies = 2
angle = 3
approach = 0.9

[preset."Long tails"]
galaxies = 2
spin = "with the orbit"
angle = 35
variety = 0.3

[preset.Mixed]
galaxies = 3
shape = "mixed"
zoom = 1

[preset.Lone]
galaxies = 1
shape = "spiral"
galsize = 1.8
zoom = 1.6
tilt = 0.9

# Texels 0-4 are the galaxy cores (heavy), texel 5 remembers which encounter
# is running, and every texel from 8 on is a star: position (xy) and velocity (zw).
# Two half-steps a frame keep close passes stable.
[[buffer]]
name = "state"
shader = "state.frag"
size = [512, 256]
format = "rgba32f"
iterations = 2
channels = ["state"]

[[buffer]]
name = "stars"
draw = "points"
source = "state"
count = "stars"
vertex = "stars.vert"
shader = "stars.frag"
fade = "trails"
format = "rgba16f"
mipmap = true

[image]
shader = "main.frag"
channels = ["stars"]
