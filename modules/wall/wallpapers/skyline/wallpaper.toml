name = "Skyline"
author = "Kinetic"
description = "A city at night. Windows switch on and off with your local time of day"
fps = 10
scale = 1.0
preview_time = 30

[param.hour]
label = "Hour (-1 = live)"
min = -1
max = 24
step = 0.25
default = -1

[param.density]
label = "Building density"
min = 0.5
max = 2
step = 0.05
default = 1

[param.lights]
label = "Lit windows"
min = 0
max = 1
step = 0.05
default = 0.5

[param.traffic]
type = "bool"
label = "Traffic"
default = true

[param.stars]
type = "bool"
label = "Stars"
default = true
