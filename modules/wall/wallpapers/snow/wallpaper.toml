name = "Snowfall"
author = "Kinetic"
description = "Layered snowfall with wind, over a hush of hills"
fps = 30
scale = 0.75

[param.amount]
label = "Snowfall"
min = 0
max = 1.5
step = 0.05
default = 0.8

[param.wind]
label = "Wind"
min = -2
max = 2
step = 0.05
default = 0.3

[param.size]
label = "Flake size"
min = 0.5
max = 2.5
step = 0.05
default = 1

[param.layers]
type = "int"
label = "Depth layers"
min = 2
max = 8
default = 6

[param.ground]
type = "bool"
label = "Snowy hills"
default = true
