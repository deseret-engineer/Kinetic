name = "Particle Life"
author = "Kinetic"
description = "Species of particles that attract or repel each other by secret rules, and organize into cells, worms and swarms. Change the seed for new rules"
fps = 30
scale = 1.0
pointer = true
adaptive = false
preview_time = 40
common = "common.glsl"

[param.particles]
type = "int"
label = "Particles"
description = "Every particle feels every other one, so cost grows with the square"
min = 256
max = 4096
step = 256
default = 2048

[param.species]
type = "int"
label = "Species"
min = 2
max = 8
default = 6

[param.seed]
type = "int"
label = "Rules"
description = "Each number is a different attraction table"
min = 0
max = 9999
default = 7

[param.radius]
label = "Interaction range"
min = 0.03
max = 0.2
step = 0.005
default = 0.09

[param.force]
label = "Force"
min = 0.1
max = 3
step = 0.05
default = 1

[param.friction]
label = "Friction"
min = 0
max = 1
step = 0.02
default = 0.6

[param.size]
label = "Particle size"
min = 1
max = 10
step = 0.5
default = 1

[param.trails]
label = "Trails"
min = 0
max = 0.95
step = 0.01
default = 0.75

[param.pointer]
type = "choice"
label = "Pointer"
options = ["repel", "attract", "ignore"]
default = "repel"

[preset.Cells]
seed = 7
species = 6
radius = 0.09

[preset.Worms]
seed = 42
species = 4
friction = 0.4
radius = 0.07

[preset.Galaxy]
seed = 1234
species = 3
radius = 0.14
force = 0.6

[preset.Chaos]
seed = 99
species = 8
force = 2
friction = 0.2

# One texel per particle: position (xy, uv on a torus) and velocity (zw)
[[buffer]]
name = "state"
shader = "state.frag"
size = [64, 64]
format = "rgba32f"
channels = ["state"]

[[buffer]]
name = "dots"
draw = "points"
source = "state"
count = "particles"
vertex = "dots.vert"
shader = "dots.frag"
fade = "trails"
format = "rgba16f"
scale = 0.5
mipmap = true

[image]
shader = "main.frag"
channels = ["dots"]
