name = "Truchet"
author = "Kinetic"
description = "Quarter-circle tiles forming endless paths, with light flowing along them"
fps = 30
scale = 1.0
parallax = 1      # an endless plane: pans with workspace parallax (Kinetic motion)

[param.tiles]
type = "int"
label = "Tiles across the height"
min = 4
max = 30
default = 12

[param.speed]
label = "Flow speed"
min = 0
max = 3
step = 0.05
default = 1

[param.width]
label = "Line width"
min = 0.03
max = 0.25
step = 0.01
default = 0.09

[param.flip]
label = "Re-tile rate"
description = "How often tiles rotate on their own"
min = 0
max = 1
step = 0.05
default = 0.2

[param.style]
type = "choice"
label = "Style"
options = ["lines", "filled", "neon"]
default = "lines"
